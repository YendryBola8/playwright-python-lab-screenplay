[tool.poetry]
name = "playwright-screenplay"
version = "0.1.0"
description = "E2E con Playwright + Screenplay"
authors = ["Yendry"]

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^8.0.0"
pytest-playwright = "^0.5.0"
playwright = "^1.42.0"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"